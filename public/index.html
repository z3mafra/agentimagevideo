<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de mídia</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --border: #d9dde3;
    --accent: #3b5bdb; --accent-text: #ffffff; --ok: #2b8a3e; --warn: #b35c00; --err: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --card: #1c2026; --text: #e7eaee; --muted: #9aa3ad; --border: #313842;
      --accent: #748ffc; --accent-text: #0e1116; --ok: #69db7c; --warn: #ffa94d; --err: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab { flex: 1 1 160px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent;
         color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  .tab small { display: block; color: var(--muted); font-size: 0.8rem; }
  .tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tab:disabled { cursor: not-allowed; opacity: 0.6; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  textarea, input[type="url"], select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
         background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; align-items: end; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row select { flex: 1 1 200px; width: auto; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 20px 0 0; padding: 4px 14px 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .actions { margin-top: 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 22px;
         font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
         padding: 8px 14px; font: inherit; cursor: pointer; }
  #status { margin-top: 20px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); display: none; }
  #status.show { display: block; }
  #status.ok { border-color: var(--ok); } #status.warn { border-color: var(--warn); } #status.err { border-color: var(--err); }
  #status .title { font-weight: 600; }
  #status.ok .title { color: var(--ok); } #status.warn .title { color: var(--warn); } #status.err .title { color: var(--err); }
  #status .detail { color: var(--muted); font-size: 0.9rem; margin-top: 4px; word-break: break-word; }
  .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--border);
         border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #preview { margin-top: 20px; }
  #preview img, #preview video { max-width: 100%; border-radius: 8px; display: block; background: #000; }
  #preview a { display: inline-block; margin-top: 8px; margin-right: 16px; color: var(--accent); }
  .history { margin-top: 24px; }
  .history h2 { font-size: 1.15rem; margin: 0 0 12px; }
  .history-empty { color: var(--muted); }
  .item { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .item:first-of-type { border-top: 0; }
  .thumb { width: 112px; height: 112px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
         object-fit: cover; display: flex; align-items: center; justify-content: center; color: var(--muted);
         font-size: 0.8rem; text-align: center; overflow: hidden; }
  .item-meta { color: var(--muted); font-size: 0.82rem; }
  .item-prompt { margin: 4px 0 8px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3;
         -webkit-box-orient: vertical; overflow: hidden; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.err { color: var(--err); border-color: var(--err); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .item-actions { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.9rem; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .linkish.danger { color: var(--err); }
  .item-actions a { color: var(--accent); }
  @media (max-width: 420px) { .item { grid-template-columns: 80px 1fr; } .thumb { width: 80px; height: 80px; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Gerador de imagens e vídeos</h1>
  <div class="card">
    <div class="tabs" role="tablist" id="tabs"></div>

    <form id="form" novalidate>
      <label for="prompt">Descreva o que você quer gerar</label>
      <textarea id="prompt" required placeholder="Ex.: um tênis branco girando sobre fundo neon"></textarea>

      <div id="imageField" hidden>
        <label for="imageUrl">URL da imagem (primeiro quadro do vídeo)</label>
        <input id="imageUrl" type="url" placeholder="https://..." inputmode="url">
        <div class="hint">Cole o link direto da imagem (ex.: https://i.imgur.com/XXXX.jpeg), não o link da página.</div>
      </div>

      <div id="optionsField" hidden>
        <div class="options" id="options"></div>
      </div>

      <fieldset id="brandField" hidden>
        <legend>Preset de marca (opcional)</legend>
        <label for="brandPreset">Estilo de marca</label>
        <div class="row">
          <select id="brandPreset"><option value="">Nenhum</option></select>
          <button type="button" class="secondary" id="loadCatalog">Carregar presets</button>
        </div>
        <div class="hint" id="brandHint">Clique em "Carregar presets" para buscar os estilos disponíveis na sua conta.</div>
        <div id="brandImages" hidden>
          <label for="brandProduct">URL da imagem do produto</label>
          <input id="brandProduct" type="url" placeholder="https://..." inputmode="url">
          <label for="brandRef">URL da imagem de referência (opcional)</label>
          <input id="brandRef" type="url" placeholder="https://..." inputmode="url">
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary" id="generate">Gerar</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite">
      <div class="title" id="statusTitle"></div>
      <div class="detail" id="statusDetail"></div>
      <div class="actions" id="statusActions" hidden>
        <button type="button" class="secondary" id="resume">Continuar consultando</button>
      </div>
    </div>

    <div id="preview"></div>
  </div>

  <section class="card history" aria-labelledby="historyTitle">
    <h2 id="historyTitle">Histórico</h2>
    <div id="history"><p class="history-empty">Carregando...</p></div>
  </section>
</main>

<script>
(() => {
  const TERMINAL = ['completed', 'failed', 'nsfw', 'canceled'];
  const POLL_START_MS = 2000, POLL_MAX_MS = 10000;          // intervalo normal de consulta
  const RETRY_BASE_MS = 1000, RETRY_MAX_MS = 30000;          // backoff só para rede/5xx
  const MAX_CONSECUTIVE_FAILURES = 6;
  const MAX_POLL_MS = 15 * 60 * 1000;

  const $ = (id) => document.getElementById(id);
  const els = {
    tabs: $('tabs'), form: $('form'), prompt: $('prompt'), imageField: $('imageField'), imageUrl: $('imageUrl'),
    generate: $('generate'), status: $('status'), statusTitle: $('statusTitle'), statusDetail: $('statusDetail'),
    statusActions: $('statusActions'), resume: $('resume'), preview: $('preview'),
    optionsField: $('optionsField'), options: $('options'), brandField: $('brandField'), brandPreset: $('brandPreset'),
    loadCatalog: $('loadCatalog'), brandHint: $('brandHint'), brandImages: $('brandImages'),
    brandProduct: $('brandProduct'), brandRef: $('brandRef'), history: $('history'),
  };
  const catalogs = {};     // presets de marca já carregados, por preset

  let presets = [];
  let active = null;       // preset selecionado
  let busy = false;        // geração em andamento (polling ativo)
  let pending = null;      // { requestId, preset } de uma geração cujo polling foi pausado

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function setBusy(value) {
    busy = value;
    els.generate.disabled = value;
    els.generate.textContent = value ? 'Gerando...' : 'Gerar';
    els.tabs.querySelectorAll('button').forEach((b) => { b.disabled = value; });
    els.loadCatalog.disabled = value;
  }

  function showStatus(kind, title, detail = '', { spinner = false, resumable = false } = {}) {
    els.status.className = `show ${kind}`;
    els.statusTitle.textContent = '';
    if (spinner) {
      const s = document.createElement('span');
      s.className = 'spinner';
      els.statusTitle.appendChild(s);
    }
    els.statusTitle.appendChild(document.createTextNode(title));
    els.statusDetail.textContent = detail;
    els.statusActions.hidden = !resumable;
  }

  function safeUrl(value, { allowRelative = false } = {}) {
    try {
      const u = allowRelative ? new URL(value, location.href) : new URL(value);
      return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : null;
    } catch { return null; }
  }

  // Links de página (post do Instagram, galeria do Imgur) não são a imagem em si.
  function pageLinkProblem(url) {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    const isPage = (host === 'imgur.com' && !/\.(jpe?g|png|webp|gif)$/i.test(u.pathname))
      || (host === 'instagram.com' && /^\/(p|reel|stories)\//.test(u.pathname));
    return isPage
      ? 'Esse link é de uma página, não da imagem. Abra-o, clique com o botão direito na foto e use '
        + '"Copiar endereço da imagem" (algo como https://i.imgur.com/XXXX.jpeg).'
      : null;
  }

  // Valida uma URL de imagem digitada; mostra o erro e devolve null se não servir.
  function readImageUrl(input, emptyMessage, { optional = false } = {}) {
    const raw = input.value.trim();
    if (!raw && optional) return '';
    const url = safeUrl(raw);
    const problem = !url ? emptyMessage : pageLinkProblem(url);
    if (problem) {
      showStatus('err', problem);
      input.focus();
      return null;
    }
    return url;
  }

  function renderTabs() {
    els.tabs.textContent = '';
    for (const p of presets) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(p.key === active?.key));
      b.textContent = p.name;
      const small = document.createElement('small');
      small.textContent = p.mediaType === 'image' ? 'Imagem' : 'Vídeo';
      b.appendChild(small);
      b.addEventListener('click', () => selectPreset(p.key));
      els.tabs.appendChild(b);
    }
  }

  const formatChoice = (v, labels = {}) => (v === true ? 'Sim' : v === false ? 'Não' : labels[v] ?? String(v));

  // Um seletor por opção do preset. "Padrão" (valor vazio) não envia o campo.
  function renderOptions() {
    els.options.textContent = '';
    const options = active.options || [];
    els.optionsField.hidden = !options.length;
    for (const o of options) {
      const id = `opt-${o.field}`;
      const label = document.createElement('label');
      label.htmlFor = id;
      label.textContent = o.label;
      const select = document.createElement('select');
      select.id = id;
      select.dataset.field = o.field;
      select.add(new Option(o.default === null ? 'Padrão' : `Padrão (${formatChoice(o.default, o.labels)})`, ''));
      for (const c of o.choices) {
        if (c !== o.default) select.add(new Option(formatChoice(c, o.labels), JSON.stringify(c)));
      }
      const wrap = document.createElement('div');
      wrap.append(label, select);
      els.options.appendChild(wrap);
    }
  }

  // A resposta do catálogo pode vir como lista ou embrulhada em items/presets/data.
  function normalizeCatalog(data) {
    const list = Array.isArray(data) ? data : data?.items || data?.presets || data?.data || data?.results || [];
    return list
      .map((item) => {
        const id = item?.id ?? item?.preset_id;
        return id === undefined || id === null ? null : { id: String(id), name: String(item.name ?? item.title ?? id) };
      })
      .filter(Boolean);
  }

  function renderCatalog() {
    const list = catalogs[active.key];
    els.brandPreset.length = 1;
    els.brandPreset.value = '';
    els.brandImages.hidden = true;
    els.brandPreset.disabled = !list;
    els.loadCatalog.hidden = !!list;
    if (!list) {
      els.brandHint.textContent = 'Clique em "Carregar presets" para buscar os estilos disponíveis na sua conta.';
      return;
    }
    for (const item of list) els.brandPreset.add(new Option(item.name, item.id));
    els.brandHint.textContent = list.length
      ? 'Com um preset de marca você informa a foto do produto; "Melhorar o texto" passa a ser Sim por padrão.'
      : 'Nenhum preset de marca disponível na sua conta.';
  }

  async function loadCatalog() {
    const preset = active;
    els.loadCatalog.disabled = true;
    els.brandHint.textContent = 'Carregando presets de marca...';
    try {
      const res = await fetch(`/api/presets/${encodeURIComponent(preset.key)}/catalog`, { cache: 'no-store' });
      const data = await readBody(res);
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      catalogs[preset.key] = normalizeCatalog(data);
      if (active === preset) renderCatalog();
    } catch (err) {
      if (active === preset) els.brandHint.textContent = `Não foi possível carregar os presets de marca: ${err.message}`;
    } finally {
      els.loadCatalog.disabled = busy;
    }
  }

  function selectPreset(key) {
    if (busy) return;
    active = presets.find((p) => p.key === key);
    els.imageField.hidden = !active.requiresImage;
    els.brandField.hidden = !active.hasCatalog;
    renderOptions();
    if (active.hasCatalog) renderCatalog();
    renderTabs();
  }

  els.loadCatalog.addEventListener('click', () => { if (!busy) loadCatalog(); });
  els.brandPreset.addEventListener('change', () => { els.brandImages.hidden = !els.brandPreset.value; });

  function renderPreview(preset, result) {
    els.preview.textContent = '';
    const remote = safeUrl(preset.mediaType === 'image' ? result?.images?.[0]?.url : result?.video?.url);
    const local = result?.local_url ? safeUrl(result.local_url, { allowRelative: true }) : null;
    const url = local || remote;
    if (!url) {
      showStatus('warn', 'Concluído, mas a resposta não trouxe o link da mídia.', JSON.stringify(result).slice(0, 500));
      return;
    }
    const media = document.createElement(preset.mediaType === 'image' ? 'img' : 'video');
    media.src = url;
    if (preset.mediaType === 'image') media.alt = 'Imagem gerada';
    else { media.controls = true; media.playsInline = true; }
    const link = document.createElement('a');
    link.href = url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'Abrir em nova aba';
    els.preview.append(media, link);
    if (local) els.preview.append(downloadLink(local, 'Baixar'));
  }

  function downloadLink(url, text) {
    const a = document.createElement('a');
    a.href = url;
    a.download = '';
    a.textContent = text;
    return a;
  }

  // ---------- Histórico ----------
  const STATUS_LABEL = {
    queued: ['Na fila', ''], in_progress: ['Gerando', ''], completed: ['Pronto', 'ok'],
    failed: ['Falhou', 'err'], nsfw: ['Bloqueado (NSFW)', 'err'], canceled: ['Cancelado', 'warn'],
  };
  const dateFmt = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

  async function loadHistory() {
    try {
      const res = await fetch('/api/history', { cache: 'no-store' });
      const data = await readBody(res);
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      renderHistory(data.items || []);
    } catch (err) {
      els.history.textContent = '';
      const p = document.createElement('p');
      p.className = 'history-empty';
      p.textContent = `Não foi possível carregar o histórico: ${err.message}`;
      els.history.appendChild(p);
    }
  }

  function renderHistory(items) {
    els.history.textContent = '';
    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'history-empty';
      p.textContent = 'Nenhuma geração ainda. O que você gerar aparece aqui, com uma cópia salva no servidor.';
      els.history.appendChild(p);
      return;
    }
    for (const item of items) els.history.appendChild(renderItem(item));
  }

  function renderItem(item) {
    const row = document.createElement('div');
    row.className = 'item';
    const local = item.local_url ? safeUrl(item.local_url, { allowRelative: true }) : null;
    const remote = item.remote_url ? safeUrl(item.remote_url) : null;
    const mediaUrl = local || remote;

    let thumb;
    if (mediaUrl && item.mediaType === 'image') {
      thumb = document.createElement('img');
      thumb.src = mediaUrl;
      thumb.alt = item.prompt;
      thumb.loading = 'lazy';
    } else if (mediaUrl) {
      thumb = document.createElement('video');
      thumb.src = mediaUrl;
      thumb.muted = true;
      thumb.preload = 'metadata';
      thumb.playsInline = true;
      thumb.addEventListener('mouseenter', () => thumb.play().catch(() => {}));
      thumb.addEventListener('mouseleave', () => thumb.pause());
    } else {
      thumb = document.createElement('div');
      thumb.textContent = item.mediaType === 'image' ? 'Imagem' : 'Vídeo';
    }
    thumb.classList.add('thumb');

    const body = document.createElement('div');
    const meta = document.createElement('div');
    meta.className = 'item-meta';
    const [label, kind] = STATUS_LABEL[item.status] || [item.status, ''];
    const badge = document.createElement('span');
    badge.className = `badge ${kind}`;
    badge.textContent = label;
    const when = item.created_at ? dateFmt.format(new Date(item.created_at)) : '';
    meta.append(badge, document.createTextNode(` ${item.presetName || item.preset} · ${when}`));

    const prompt = document.createElement('div');
    prompt.className = 'item-prompt';
    prompt.textContent = item.prompt;
    prompt.title = item.prompt;

    const actions = document.createElement('div');
    actions.className = 'item-actions';
    if (local) actions.appendChild(downloadLink(local, 'Baixar'));
    if (mediaUrl) {
      const open = document.createElement('a');
      open.href = mediaUrl; open.target = '_blank'; open.rel = 'noopener'; open.textContent = 'Abrir';
      actions.appendChild(open);
    }
    if (item.status === 'completed' && !local) {
      const note = document.createElement('span');
      note.className = 'item-meta';
      note.textContent = 'Sem cópia local (o link da Higgsfield pode expirar).';
      actions.appendChild(note);
    }
    const preset = presets.find((p) => p.key === item.preset);
    if (!TERMINAL.includes(item.status) && preset) {
      actions.appendChild(actionButton('Continuar consultando', () => {
        if (!busy) { selectPreset(preset.key); runPoll(item.request_id, preset); }
      }));
    }
    if (preset) {
      actions.appendChild(actionButton('Reusar texto', () => {
        if (busy) return;
        selectPreset(preset.key);
        els.prompt.value = item.prompt;
        if (preset.requiresImage && item.inputs?.image_url) els.imageUrl.value = item.inputs.image_url;
        els.prompt.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }));
    }
    // Uma imagem pronta pode virar o primeiro quadro de um vídeo (precisa do link público).
    const reels = presets.find((p) => p.requiresImage);
    if (item.mediaType === 'image' && remote && reels) {
      actions.appendChild(actionButton('Animar em vídeo', () => {
        if (busy) return;
        selectPreset(reels.key);
        els.imageUrl.value = remote;
        els.prompt.value = '';
        els.prompt.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }));
    }
    actions.appendChild(actionButton('Excluir', async () => {
      if (!confirm('Excluir este item do histórico e a cópia salva?')) return;
      const res = await fetch(`/api/history/${encodeURIComponent(item.request_id)}`, { method: 'DELETE' }).catch(() => null);
      if (!res || !res.ok) showStatus('err', 'Não foi possível excluir o item.');
      loadHistory();
    }, 'danger'));

    body.append(meta, prompt, actions);
    row.append(thumb, body);
    return row;
  }

  function actionButton(text, onClick, extraClass = '') {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `linkish ${extraClass}`.trim();
    b.textContent = text;
    b.addEventListener('click', onClick);
    return b;
  }

  function showTerminal(preset, data, requestId) {
    const detail = `request_id: ${requestId}`;
    switch (data.status) {
      case 'completed':
        showStatus('ok', 'Pronto!', detail);
        renderPreview(preset, data);
        break;
      case 'nsfw':
        showStatus('err', 'Bloqueado pelo filtro de conteúdo (NSFW).',
          `A Higgsfield recusou o resultado. Ajuste o texto ou a imagem e gere de novo. ${detail}`);
        break;
      case 'failed':
        showStatus('err', 'A geração falhou.', `${data.error || data.detail || data.message || ''} ${detail}`.trim());
        break;
      case 'canceled':
        showStatus('warn', 'A geração foi cancelada.', detail);
        break;
    }
  }

  async function readBody(res) {
    try { return await res.json(); } catch { return {}; }
  }

  // Consulta o status até um estado terminal. Nunca re-envia a geração.
  async function poll(requestId, preset) {
    const started = Date.now();
    let interval = POLL_START_MS;
    let failures = 0;
    let lastStatus = 'queued';

    while (true) {
      let res = null, data = {};
      try {
        res = await fetch(`/api/presets/status/${encodeURIComponent(requestId)}`, { cache: 'no-store' });
        data = await readBody(res);
      } catch { res = null; }

      if (res && res.ok) {
        failures = 0;
        lastStatus = data.status || lastStatus;
        if (TERMINAL.includes(data.status)) return showTerminal(preset, data, requestId);
        showStatus('', 'Gerando...', `Status: ${lastStatus} · request_id: ${requestId}`, { spinner: true });
      } else {
        // Rede ou 5xx retryable: backoff limitado. Auth/validação: para na hora.
        const retryable = !res || (res.status >= 500 && data.retryable !== false);
        if (!retryable) {
          showStatus('err', 'Não foi possível consultar o status.', `${data.error || `HTTP ${res.status}`} · request_id: ${requestId}`);
          return;
        }
        failures += 1;
        if (failures > MAX_CONSECUTIVE_FAILURES) {
          pending = { requestId, preset };
          showStatus('warn', 'Sem resposta do servidor no momento.',
            `A geração não foi reenviada. request_id: ${requestId}`, { resumable: true });
          return;
        }
        const backoff = Math.min(RETRY_MAX_MS, RETRY_BASE_MS * 2 ** failures);
        showStatus('', 'Gerando...', `Conexão instável, tentando consultar de novo... · request_id: ${requestId}`, { spinner: true });
        await sleep(backoff / 2 + Math.random() * backoff / 2);
        continue;
      }

      if (Date.now() - started > MAX_POLL_MS) {
        pending = { requestId, preset };
        showStatus('warn', 'Ainda em processamento.',
          `Está demorando mais que o normal. A geração não foi reenviada. request_id: ${requestId}`, { resumable: true });
        return;
      }
      await sleep(interval);
      interval = Math.min(POLL_MAX_MS, Math.round(interval * 1.5));
    }
  }

  async function runPoll(requestId, preset) {
    pending = null;
    setBusy(true);
    try {
      await poll(requestId, preset);
    } finally {
      setBusy(false);
      loadHistory();
    }
  }

  els.resume.addEventListener('click', () => {
    if (pending && !busy) runPoll(pending.requestId, pending.preset);
  });

  els.form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (busy || !active) return;

    const prompt = els.prompt.value.trim();
    if (!prompt) {
      showStatus('err', 'Escreva um texto (prompt) antes de gerar.');
      els.prompt.focus();
      return;
    }
    const payload = { prompt };
    if (active.requiresImage) {
      const imageUrl = readImageUrl(els.imageUrl, 'Informe a URL de uma imagem (https://...).');
      if (!imageUrl) return;
      payload.image_url = imageUrl;
    }
    for (const select of els.options.querySelectorAll('select')) {
      if (select.value) payload[select.dataset.field] = JSON.parse(select.value);
    }
    if (active.hasCatalog && els.brandPreset.value) {
      const product = readImageUrl(els.brandProduct, 'Com preset de marca, informe a URL da imagem do produto (https://...).');
      if (!product) return;
      const ref = readImageUrl(els.brandRef, 'A URL da imagem de referência não é válida (https://...).', { optional: true });
      if (ref === null) return;
      payload.preset_id = els.brandPreset.value;
      payload.image_urls = ref ? [product, ref] : [product];
    }

    const preset = active;
    els.preview.textContent = '';
    pending = null;
    setBusy(true);
    showStatus('', 'Gerando...', 'Enviando pedido...', { spinner: true });

    let requestId;
    try {
      // Um único envio. Se falhar de forma ambígua, NÃO é repetido automaticamente.
      const res = await fetch(`/api/presets/${encodeURIComponent(preset.key)}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await readBody(res);
      if (!res.ok || !data.request_id) {
        const extra = data.missing ? ` Campos faltando: ${data.missing.join(', ')}.`
          : data.upstream ? ` Resposta da Higgsfield: ${JSON.stringify(data.upstream).slice(0, 300)}` : '';
        showStatus('err', 'Não foi possível iniciar a geração.', `${data.error || `HTTP ${res.status}`}${extra}`);
        setBusy(false);
        return;
      }
      requestId = data.request_id;
    } catch {
      showStatus('err', 'Falha de conexão ao enviar o pedido.',
        'O pedido pode ou não ter chegado. Ele não foi reenviado automaticamente; confira antes de gerar de novo.');
      setBusy(false);
      return;
    }
    setBusy(false);
    loadHistory();
    await runPoll(requestId, preset);
  });

  fetch('/api/presets')
    .then((r) => r.json())
    .then((data) => {
      presets = data.presets || [];
      if (presets.length) selectPreset(presets[0].key);
      loadHistory();
    })
    .catch(() => showStatus('err', 'Não foi possível carregar os presets. O servidor está rodando?'));
})();
</script>
</body>
</html>
